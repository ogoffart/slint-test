# Contributions are licensed under MIT-0, see CONTRIBUTING.md#license.
# A contributor accepts these terms once, for all their pull requests, by ticking
# a checkbox this workflow adds to the description of their first pull request.
# The CONTRIBUTION_AGREEMENTS repository variable records who accepted, one
# account per line, and this workflow appends the account as soon as the box is
# ticked. The pull request itself keeps the ticked box, and the workflow run
# keeps the time.
#
# `pull_request_target` runs with the secrets of this repository, so this
# workflow never checks out or runs code from the pull request.
# It only reads the description.

name: Contribution agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  actions: write
  pull-requests: write

jobs:
  check:
    # Team members are covered by their contract, bots by their operator's terms.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJson('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      SENDER: ${{ github.event.sender.login }}
      BODY: ${{ github.event.pull_request.body }}
      VARIABLE: /repos/${{ github.repository }}/actions/variables/CONTRIBUTION_AGREEMENTS
      AGREEMENT: |
        ## Contribution agreement

        - [ ] I license my contribution, and all my future contributions to Slint, under the [MIT No Attribution license (MIT-0)](https://opensource.org/license/mit-0). I retain ownership of my contributions and have the right to grant this license. No third party (such as my employer) owns rights that prevent me from doing so.
    steps:
      - name: Look up the agreement
        id: lookup
        run: |
          accepted_before() {
            { gh api "$VARIABLE" --jq .value 2>/dev/null || true; } | tr -s '[:space:]' '\n' | grep -qixF -- "$AUTHOR"
          }
          # The box only counts with the complete sentence after it, unchanged.
          sentence=$(printf '%s\n' "$AGREEMENT" | sed -n 's/^- \[ \] //p')
          box_followed_by_sentence() {
            printf '%s\n' "$BODY" | tr -d '\r' \
              | sed -n "s/^[[:space:]]*[-*][[:space:]]*\\[$1\\][[:space:]]*//p" | sed 's/[[:space:]]*$//' \
              | grep -qxF -- "$sentence"
          }
          ticked() { box_followed_by_sentence '[xX]'; }
          present() { box_followed_by_sentence '[ xX]'; }
          if accepted_before; then
            echo "Recorded in the CONTRIBUTION_AGREEMENTS variable."
            status=recorded
          elif ticked && [ "$SENDER" = "$AUTHOR" ]; then
            # Only the author's own edit counts as their acceptance.
            status=ticked
          elif ticked; then
            status=ticked-by-someone-else
          elif present; then
            status=unticked
          else
            status=missing
          fi
          echo "status=$status" | tee -a "$GITHUB_OUTPUT"

      - name: Add the agreement checkbox to the description
        if: steps.lookup.outputs.status == 'missing'
        run: |
          { [ -n "$BODY" ] && printf '%s\n\n' "$BODY"; printf '%s' "$AGREEMENT"; } \
            | gh pr edit "$PR" --repo "$REPO" --body-file -

      - name: Welcome the contributor and ask them to tick the box
        if: github.event.action == 'opened' && steps.lookup.outputs.status != 'recorded' && steps.lookup.outputs.status != 'ticked'
        run: |
          gh pr comment "$PR" --repo "$REPO" --body-file - <<'MSG'
          👋 Welcome, and thanks for your pull request!

          If you haven't yet, take a look at our [CONTRIBUTING.md](https://github.com/slint-ui/slint/blob/master/CONTRIBUTING.md).

          📄 **Licensing:** contributions to Slint are licensed under the [MIT No Attribution license (MIT-0)](https://opensource.org/license/mit-0); you keep the copyright of your work.
          To accept these terms, tick the checkbox under **Contribution agreement** in the description of this pull request.
          You only do this once: we record your account and won't ask again.
          The *Contribution agreement* check stays red until the box is ticked.
          If you can't agree, leave the box unticked and tell us in a comment.

          We're a small team, and reviews can take a while. If you don't hear back, nudge us in our [public chat](https://chat.slint.dev) so your pull request doesn't slip through the cracks.
          MSG

      - name: Record the agreement
        if: steps.lookup.outputs.status == 'ticked'
        run: |
          # Read the variable again rather than using the value the run started
          # with, so a record made by another run in the meantime isn't lost.
          if gh api "$VARIABLE" --jq .value > current.txt 2>/dev/null; then
            method=PATCH url="$VARIABLE"
          else
            : > current.txt
            method=POST url="${VARIABLE%/*}"
          fi
          { tr -s '[:space:]' '\n' < current.txt; echo "$AUTHOR"; } | grep . | LC_ALL=C sort -f -u > updated.txt
          gh api --method "$method" "$url" -f name=CONTRIBUTION_AGREEMENTS -f value="$(cat updated.txt)" > /dev/null
          echo "Recorded $AUTHOR."

      - name: Verify the agreement
        if: steps.lookup.outputs.status != 'recorded' && steps.lookup.outputs.status != 'ticked'
        run: |
          if [ "${{ steps.lookup.outputs.status }}" = ticked-by-someone-else ]; then
            echo "::error::The author of the pull request must tick the contribution agreement checkbox themselves."
          else
            echo "::error::Tick the checkbox under 'Contribution agreement' in the pull request description to license your contribution under MIT-0."
          fi
          exit 1
